<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modal Countdown Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Modal Structure -->
  <div id="myModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="modalTitle">The Cheltenham festival is just x days away!</h2>
      <p>Get on our mailing list for FREE Tips, Exclusive Discounts, and much more!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
